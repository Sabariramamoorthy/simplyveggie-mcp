# Openship deploy stack (CloudShift HP Mini Elite). TLS ends at the VPS Caddy; the Openship
# edge forwards to the app on 9320. All application config (PUBLIC_ORIGIN, MCP_TOKEN, OWNER_KEY,
# SIMPLYVEGGIE_PHONE, SIMPLYVEGGIE_PASSWORD) is read at runtime from the Infisical project below;
# only the read-only machine identity is set on the service.
# EXACTLY ONE instance: one Simply Veggie account and one cart.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      HOST: '0.0.0.0'
      PORT: '9320'
      DATA_DIR: /data
      INFISICAL_URL: ${INFISICAL_URL:-https://infisical.app.cloudshiftsolutions.in}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-prod}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET}
    ports:
      - '${APP_PORT:-9320}:9320'
    volumes:
      - simplyveggie-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9320/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  simplyveggie-data:
